# Ticket Distribution — Docker/Podman Compose
# Orquesta PostgreSQL + backend FastAPI + frontend UI5.
# Ejecutar con:  podman compose up --build   (o docker compose up --build)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./1_backend/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: ./1_frontend/ui
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Opcional: exponer públicamente en el host de producción futuro.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - ui
  #   restart: unless-stopped

volumes:
  pgdata:
